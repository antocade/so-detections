title: Elastic Security Events Authentication Failure Detection - macOS
id: 31f0f325-3844-47bc-8add-8386d50def8d
status: experimental
description: Elastic Agent - macos-security-events detection for failed login on main macbook login
references:
    - https://www.elastic.co/guide/en/security/current/endpoint-protection.html
author: Caden Anton
date: 2026/08/21
tags:
    - attack.t1110
logsource:
    product: elastic
    service: endpoint
detection:
    selection:
        data_stream.dataset: 'macos.authentication'
        event.module: 'macos'
    selection_startswith:
        message|startswith: 'Authentication failed for'
    condition: selection and selection_startswith
falsepositives:
    - Authenticated tests with Macbook enpoint for failed passwords
    - Accidental password input
level: high