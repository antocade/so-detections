title: Elastic Security Events Authentication Failure Detection - macOS
id: 31f0f325-3844-47bc-8add-8386d50def8d
status: experimental
description: Elastic Agent - macos-security-events detection for failed login on main macbook login
references:
    - https://www.elastic.co/docs/reference/integrations/macos
author: Caden Anton
date: 2026/09/09
tags:
    - attack.t1110.001
    - attack.credential-access
logsource:
    product: macos
    service: authentication
detection:
    selection:
        event.dataset: 'macos.authentication'
        macos.subsystem: 'com.apple.opendirectoryd'
        macos.event.message.description|startswith: 'Authentication failed for'
    condition: selection
falsepositives:
    - Authenticated tests with Macbook enpoint for failed passwords
    - Accidental password input
level: high
