title: Elastic Security Events Authentication Failure Detection - macOS
id: 31f0f325-3844-47bc-8add-8386d50def8d
status: experimental
description: Elastic Agent - macos-security-events detection for failed login on main macbook login
references:
    - https://www.elastic.co/docs/reference/integrations/macos
author: Caden Anton
date: 2026/09/09
tags:
    - attack.t1110.001
    - attack.credential-access
logsource:
    product: macos
    service: authentication
detection:
    selection:
        data_stream.dataset: 'macos.authentication'
        macos.subsystem: 'com.apple.opendirectoryd'
        macos.category: 'auth'
        log.level: 'error'
    condition: selection
falsepositives:
    - User mistyping a password at the lock screen or a sudo prompt
    - Authenticated testing against the endpoint
level: high
